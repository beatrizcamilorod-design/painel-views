name: Coletar views do Instagram

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar pela API do Instagram
        id: coleta
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python scripts/coletar_api.py

      - name: Salvar histórico no repositório
        if: steps.coleta.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados data.json
          git commit -m "Views $(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M')" || echo "sem mudanças"
          git pull --rebase -q
          git push

      - uses: actions/configure-pages@v5
        if: steps.coleta.outputs.ok == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.coleta.outputs.ok == 'true'
        with:
          path: "."

      - id: deploy
        if: steps.coleta.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
